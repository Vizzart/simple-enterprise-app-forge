services:
    backend:
        build:
            context: backend
            dockerfile: local.Dockerfile
        depends_on:
            db:
               condition: service_healthy

        ports:
          - "5050:5000"  # host 5000 is taken by macOS AirPlay Receiver
        volumes:
          - ./backend:/app

        env_file:
          - .envs/.flask
        networks:
          - internal-network
          - seaf-dev
        command: sh -c "flask --debug run --host=0.0.0.0"


    db:
        restart: always
        image: postgres:18
        env_file:
          - .envs/.postgres
        volumes:
          - postgres_data:/var/lib/postgresql
        ports:
          - "5432:5432"
        networks:
          - internal-network
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
          interval: 3s
          timeout: 3s
          retries: 5
    redis:
      image: redis:8-alpine
      networks:
        - internal-network

    worker:
      build:
        context: backend
        dockerfile: local.Dockerfile
      depends_on:
        redis:
          condition: service_started
        db:
          condition: service_healthy
      volumes:
        - ./backend:/app
      env_file:
        - .envs/.flask
      networks:
        - internal-network
        - seaf-dev
      command: sh -c "celery -A run worker -B --loglevel INFO"

networks:
  internal-network:
    driver: bridge
  # created by infra/dev/compose.yml (keycloak, ...) — start it first: make infra-up
  seaf-dev:
    external: true

volumes:
  postgres_data:
